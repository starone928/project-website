<!-- example on "input"tag -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>My 24th Web Page</title>
    <link rel="icon" href="logo.png" />
</head>

<body>
    <h3>Demo on checkbox & radio buttons</h3>

    <label>Ticket Type:</label><br>
    <input type="checkbox" checked> <label> AC 1st class </label>
    <br>
    <input type="checkbox"> <label> AC 2nd class </label>
    <br>
    <input type="checkbox"> <label> AC 3rd class </label>
    <br>
    <input type="checkbox"> <label> AC Sleeper class </label>
    <br>
    <input type="checkbox" checked> <label> Chair Car </label>
    <br><br><br>

    <label>Marital Status</label><br>
    <input type="radio" name="ms" checked><label>Single</label> &nbsp;
    <input type="radio" name="ms"><label>Married</label> &nbsp;
    <input type="radio" name="ms"><label>Widowed</label> &nbsp;
    <input type="radio" name="ms"><label>Divorced</label> &nbsp;
    <input type="radio" name="ms"><label>separated</label> &nbsp;



    <br><br>

    <fieldset>

        <legend>Marital Status</legend>
        <input type="radio" name="ms" checked><label>Single</label> &nbsp;
        <input type="radio" name="ms"><label>Married</label> &nbsp;
        <input type="radio" name="ms"><label>Widowed</label> &nbsp;
        <input type="radio" name="ms"><label>Divorced</label> &nbsp;
        <input type="radio" name="ms"><label>separated</label> &nbsp;

    </fieldset>

</body>

</html>
